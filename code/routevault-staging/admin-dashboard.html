<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingest • RouteVault</title>
  <link rel="stylesheet" href="assets/rv.css">
</head>
<body>
  <div id="rv-shell"></div>
  <main class="rv-wrap">
    <p class="kicker">Internal</p>
    <h1>Ingest snapshot</h1>
    <pre id="out" class="mono card" style="padding:1rem;overflow:auto;font-size:.8rem"></pre>
  </main>
  <script src="assets/rv.js"></script>
  <script>
    mountNav("models.html");
    mountFoot();
    loadDataset().then((d) => {
      $("#out").textContent = JSON.stringify({
        generated_at: d.generated_at,
        as_of: d.as_of,
        honesty: d.honesty,
        ingest: d.ingest,
        db_counts: d.db_counts,
        model_count: d.model_count,
        equivalence: d.equivalence,
      }, null, 2);
    });
  </script>
</body>
</html>
