<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harnesses • RouteVault</title>
  <link rel="stylesheet" href="assets/rv.css">
</head>
<body>
  <div id="rv-shell"></div>
  <main class="rv-wrap">
    <p class="kicker">Stacks, not just models</p>
    <h1>Tools & harnesses</h1>
    <p class="lede">Which runtime you use changes which model fits. The pairings below come from live tool-use scores and our own labels.</p>
    <div id="list" class="grid-3" style="margin-top:1.3rem"></div>
  </main>
  <script src="assets/rv.js"></script>
  <script>
    mountNav("ecosystem.html");
    mountFoot();
    loadDataset().then((d) => {
      $("#list").innerHTML = (d.harnesses || []).map((h) => `<div class="card" style="padding:1.1rem">
        <h2>${h.name}</h2>
        <p class="muted">${h.blurb}</p>
        ${(h.recommended || []).slice(0,5).map((m) =>
          `<div class="mono" style="margin:.35rem 0"><a href="model-detail.html?id=${encodeURIComponent(m.model_id)}">${m.model_id}</a>
           <span class="dim">${m.hermes_fit || m.rv_label} · ${fmtMoney(m.total_price)}</span></div>`
        ).join("")}
        ${h.id === "hermes" ? `<p><a class="rv-cta" href="harness-detail-hermes.html">Hermes detail</a></p>` : ""}
      </div>`).join("");
    });
  </script>
</body>
</html>
