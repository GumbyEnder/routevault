<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes pairings • RouteVault</title>
  <link rel="stylesheet" href="assets/rv.css">
</head>
<body>
  <div id="rv-shell"></div>
  <main class="rv-wrap">
    <p class="kicker">Harness</p>
    <h1>Hermes</h1>
    <p class="lede">Multi-agent orchestrator. We rank models by tool/agentic index, then intelligence, then price. “Recommended” means agentic ≥ 45, intelligence ≥ 50, context ≥ 128k.</p>
    <div class="card" style="overflow:auto;margin-top:1.2rem">
      <table class="explorer" id="tbl"></table>
    </div>
  </main>
  <script src="assets/rv.js"></script>
  <script>
    mountNav("ecosystem.html");
    mountFoot();
    loadDataset().then((d) => {
      const rows = [...d.models].sort((a, b) => {
        const rank = { Recommended: 0, Strong: 1, Usable: 2, Limited: 3 };
        return (rank[a.hermes_fit] - rank[b.hermes_fit]) || a.total_price - b.total_price;
      });
      $("#tbl").innerHTML = `<thead><tr><th>Model</th><th>Fit</th><th>Agentic</th><th>Reason</th><th>Price</th><th></th></tr></thead>
      <tbody>${rows.map((m) => `<tr>
        <td class="mono">${m.model_id}<div class="dim">${m.rv_label}</div></td>
        <td>${m.hermes_fit}</td>
        <td class="num">${m.benchmarks.tool_use ?? "—"}</td>
        <td class="num">${m.benchmarks.reasoning ?? "—"}</td>
        <td class="num">${fmtMoney(m.total_price)}</td>
        <td><a class="rv-ghost" href="route.html?tier=Project%20Planner&current=${encodeURIComponent(m.model_id)}">Route</a></td>
      </tr>`).join("")}</tbody>`;
    });
  </script>
</body>
</html>
