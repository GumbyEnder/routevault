<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model • RouteVault</title>
  <link rel="stylesheet" href="assets/rv.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="rv-shell"></div>
  <main class="rv-wrap" id="page">
    <p class="muted">Loading…</p>
  </main>
  <script src="assets/rv.js"></script>
  <script>
    mountNav("models.html");
    mountFoot();
    loadDataset().then(async (d) => {
      const id = qs("id") || d.models[0].model_id;
      const m = modelById(id);
      const det = detailById(id);
      if (!m || !det) {
        $("#page").innerHTML = `<h1>Unknown model</h1><p><a href="models.html">Back to explorer</a></p>`;
        return;
      }
      document.title = `${m.model_id} • RouteVault`;
      // Local Lab cross-link when this model has a community recipe
      try {
        const loc = await (await fetch("data/local-models.json", { cache: "no-store" })).json();
        const recipes = loc.recipes.filter((r) => r.model_id === m.model_id);
        if (recipes.length) {
          const hw = [...new Set(recipes.map((r) => r.hardware))].join(" · ");
          $("#local-note").innerHTML = `<p class="pill" style="display:inline-block;margin-top:.8rem">
            <span class="good">● Runs locally</span> — ${recipes.length} community recipe${recipes.length > 1 ? "s" : ""} (${hw})
            · <a href="lab.html" style="text-decoration:underline;color:var(--accent)">Local Lab →</a></p>`;
        }
      } catch (_) { /* local data optional */ }
      const peers = d.models.filter((x) => x.rv_label === m.rv_label && x.model_id !== m.model_id).slice(0, 3);
      const hist = det.price_history || [];
      const t90 = (det.trends || []).find((t) => t.window_days === 90) || (det.trends || [])[0];
      $("#page").innerHTML = `
        <p class="kicker">${providerMark(m.provider)} ${m.provider} · ${m.openrouter_id}</p>
        <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-end">
          <div>
            <h1 class="mono" style="font-family:IBM Plex Mono,monospace;font-size:clamp(1.6rem,4vw,2.6rem)">${m.model_id}</h1>
            <span class="pill hot">${m.rv_label}</span>
            <span class="pill">Hermes ${m.hermes_fit}</span>
            <span class="pill">${m.context_k}k context</span>
          </div>
          <div style="display:flex;gap:.45rem">
            <button class="rv-cta" onclick="addToStack('${m.model_id}')">Add to My Stack</button>
            <button class="rv-ghost" onclick="copyAgentPrompt('${m.openrouter_id || m.model_id}', '${(m.model_id+"").replace(/'/g,"")}')">Resolve &amp; use</button>
            <a class="rv-ghost" href="route.html?current=${encodeURIComponent(m.model_id)}">Route cheaper</a>
          </div>
        </div>
        <p class="lede" style="margin-top:1rem">${det.description || "No provider blurb."}</p>
        <div id="local-note"></div>
        <p class="muted">${t90 ? t90.summary : "Need more ingest days before a multi-week trend exists."}</p>

        <div class="grid-3" style="margin:1.4rem 0">
          ${[
            ["Input / M", fmtMoney(m.input_price)],
            ["Output / M", fmtMoney(m.output_price)],
            ["Value score", m.value_score],
            ["30d price Δ", fmtPct(m.price_change_30d)],
            ["Reasoning (AA)", m.benchmarks.reasoning ?? "—"],
            ["Coding (AA)", m.benchmarks.coding ?? "—"],
            ["Tool / agentic", m.benchmarks.tool_use ?? "—"],
            ["Monthly est.", "$" + m.monthly_est],
          ].map(([k,v]) => `<div class="card" style="padding:.9rem 1rem">
            <div class="dim" style="font-size:.72rem">${k}</div>
            <div class="num" style="font-size:1.25rem;margin-top:.25rem">${v}</div>
          </div>`).join("")}
        </div>

        <div class="grid-2">
          <div class="card" style="padding:1rem">
            <h2>Price history</h2>
            <p class="dim" style="font-size:.8rem">Each point is an ingest snapshot. First public day has a single point.</p>
            <canvas id="priceChart" height="140"></canvas>
          </div>
          <div class="card" style="padding:1rem">
            <h2>Capability snapshot</h2>
            <canvas id="radar" height="140"></canvas>
            <p class="dim" style="font-size:.78rem;margin-top:.6rem">Source: ${d.honesty.benchmark_source}</p>
          </div>
        </div>

        <section style="margin-top:1.8rem">
          <h2>Peers in ${m.rv_label}</h2>
          <div class="grid-3">
            ${peers.map((p) => `<a class="card" style="padding:1rem;display:block" href="model-detail.html?id=${encodeURIComponent(p.model_id)}">
              <div class="mono">${p.model_id}</div>
              <div class="muted">${fmtMoney(p.total_price)} · value ${p.value_score}</div>
            </a>`).join("") || "<p class='muted'>No peers in this label yet.</p>"}
          </div>
        </section>
        <p class="dim" style="margin-top:1.4rem;font-size:.78rem">
          Price source: ${d.honesty.price_source}. Knowledge cutoff: ${m.knowledge_cutoff || "unspecified"}.
        </p>
      `;

      const labels = hist.map((h) => h.date);
      new Chart($("#priceChart"), {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "Input", data: hist.map((h) => h.input), borderColor: "#d4a017", tension: 0.25, pointRadius: hist.length < 3 ? 4 : 2 },
            { label: "Output", data: hist.map((h) => h.output), borderColor: "#7dd3c0", tension: 0.25, pointRadius: hist.length < 3 ? 4 : 2 },
          ],
        },
        options: {
          plugins: { legend: { labels: { color: "#9a9486" } } },
          scales: {
            x: { ticks: { color: "#6d685c" }, grid: { color: "#22242c" } },
            y: { ticks: { color: "#6d685c" }, grid: { color: "#22242c" } },
          },
        },
      });
      new Chart($("#radar"), {
        type: "radar",
        data: {
          labels: ["Reason", "Code", "Tools", "Context"],
          datasets: [{
            data: [m.benchmarks.reasoning || 0, m.benchmarks.coding || 0, m.benchmarks.tool_use || 0, m.benchmarks.context || 0],
            borderColor: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#d4a017",
            backgroundColor: "rgba(212,160,23,.18)",
          }],
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { r: { suggestedMin: 0, suggestedMax: 100, ticks: { display: false }, grid: { color: cssVar("--line") }, angleLines: { color: cssVar("--line") }, pointLabels: { color: cssVar("--muted") } } },
        },
      });
      function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#2a2d36"; }
    });
  </script>
</body>
</html>
